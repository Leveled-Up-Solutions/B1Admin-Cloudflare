name: Cloudflare local verification
on:
  pull_request:
  push:
    branches: [cloudflare-port]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn postinstall
      - run: npm ci --prefix cloudflare
      - run: yarn typecheck
      - run: yarn build:cloudflare
      - run: yarn check:cloudflare
      - run: yarn test:cloudflare
      - run: npm run build --prefix cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:cloudflare:browser
        env:
          WRANGLER_SEND_METRICS: 'false'
